name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3105
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products -type d -name '3105.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/3105-unsigned.app.zip
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          (cd build && /usr/bin/zip -qry 3105-unsigned.ipa Payload)
          ls -lh build/3105-unsigned.app.zip build/3105-unsigned.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios-build
          path: |
            build/3105-unsigned.app.zip
            build/3105-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
